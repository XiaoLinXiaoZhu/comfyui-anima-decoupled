[project]
name = "comfyui-anima-decoupled"
version = "1.0.2"
description = "ComfyUI node that feeds independent text to the Qwen (source) and T5 (target) sides of Anima conditioning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XiaoLinXiaoZhu" }]
keywords = ["comfyui", "anima", "conditioning", "qwen3", "t5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/XiaoLinXiaoZhu/comfyui-anima-decoupled"
Issues = "https://github.com/XiaoLinXiaoZhu/comfyui-anima-decoupled/issues"

[tool.comfy]
DisplayName = "Anima Decoupled Conditioning"
requires-comfyui = ">=0.11.0"
